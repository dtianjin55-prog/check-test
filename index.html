function saveProgress(){

}

let weak = [];

// =========================
// ★★★ QAデータをここに入れる ★★★
// =========================
const QA = [
  {no:1,cat:"地域課題",level:"基礎",
   q:"伊勢崎市の中心市街地が衰退した主な理由を説明してください。",
   probe:"挙げた理由の中で、最も影響が大きいものは何ですか。",
   skeleton:"結論→複数要因→因果関係",
   model:"銘仙産業の衰退に加え、車社会化、郊外大型店への購買力流出、商店主の高齢化、駅周辺工事の長期化が重なった。単独原因ではなく、来街者減少と閉店が互いを強めた悪循環が重要で、客足が減ることで店が閉まり、さらに街の魅力が下がるという構造が続いたと説明できると説得力が増します。",
   point:"原因を三つ以上挙げ、悪循環まで説明できる。",
   caution:"原因の羅列だけにしない。"},
  {no:2,cat:"地域課題",level:"標準",
   q:"モータリゼーションは、なぜ地方都市の中心市街地を衰退させるのですか。",
   probe:"車の利便性を否定せずに中心部へ人を戻す方法はありますか。",
   skeleton:"変化→不利→対策",
   model:"生活が車中心になると、広い無料駐車場を持つ郊外店が選ばれやすくなり、狭い道路と駐車場不足を抱える中心部は不利になります。その結果、日常の買い物や外食が郊外に流れ、中心市街地の来訪目的が減少します。対策としては、公共交通の充実、共同駐車場の整備、歩いて楽しめるイベントや店舗を組み合わせて『車で来ても歩きたくなる中心部』をつくる視点が重要です。",
   point:"交通行動と商業立地の関係が明確。",
   caution:"車社会そのものを悪者にしない。"},
  {no:3,cat:"データ活用",level:"基礎",
   q:"RESASとは何ですか。地域課題の分析にどう使えますか。",
   probe:"どのようなデータを見て施策の効果を測りますか。",
   skeleton:"定義→用途→指標",
   model:"RESASは国が提供する地域経済分析システムで、人口移動、産業構造、観光動向などを可視化できます。これを使って『どこから人が流出しているか』『どの産業が弱いか』といった仮説を立て、施策前後で指標の変化を比較することで効果を検証します。通行量、滞在時間、創業数、売上などのデータも併用し、数字と現場の感覚を組み合わせて意思決定に活かすことが大切です。",
   point:"データを意思決定と検証に結び付ける。",
   caution:"RESASだけで因果関係が証明できると言わない。"},
  {no:4,cat:"地域文化",level:"基礎",
   q:"伊勢崎銘仙の特徴と歴史的な価値を説明してください。",
   probe:"現代の若者に魅力を伝えるなら、何を強調しますか。",
   skeleton:"定義→特徴→価値",
   model:"伊勢崎銘仙は伊勢崎周辺で発展した平織りの絹織物で、大正から昭和初期に普段着として全国的に人気を得ました。鮮やかな色柄や大胆なデザインが特徴で、当時の女性の暮らしや流行を映し出す存在でもあります。現在は、地域の産業史や職人技、デザイン性を物語として伝えられる文化資源であり、ファッションやインテリア、体験プログラムなどに展開することで若者にも魅力を感じてもらえる可能性があります。",
   point:"歴史・技術・現代価値をつなぐ。",
   caution:"単なる古い着物と説明しない。"},
  {no:5,cat:"地域文化",level:"標準",
   q:"併用絣の技術的な特徴を、専門知識のない人にも分かるように説明してください。",
   probe:"その技術を商品や体験にどう展開できますか。",
   skeleton:"平易な説明→魅力→活用",
   model:"併用絣は、縦糸と横糸の両方を先に染めてから織ることで、織るときのわずかなずれがかすれたような柄や奥行きのある模様を生み出す技術です。専門用語を使わずに『糸を先に染めて、わざと少しずらして織ることで、ぼかしや立体感のある柄が出る』と説明すると伝わりやすくなります。見学や染織体験、オリジナル柄のデジタルデザインなどに展開すれば、技術の面白さを体験として届けられます。",
   point:"専門語を言い換え、活用案まで示す。",

  {no:6,cat:"食文化",level:"基礎",
   q:"日本のルーカレー、インドカレー、タイカレー、欧風カレーの違いを説明してください。",
   probe:"伊勢崎で提供するなら、どのタイプを選びますか。",
   skeleton:"共通点→相違→選択",
   model:"日本のカレーは小麦粉のルーでとろみをつけた家庭的な味が特徴で、インドカレーは多様なスパイスと地域差があり、豆や野菜、肉などを組み合わせたバリエーションが豊富です。タイカレーはハーブやココナッツミルク、ナンプラーを使い、香りと辛さ、酸味のバランスが特徴的です。欧風カレーはフォンやバターを使った濃厚なソースがベースで、レストラン風の味わいになります。伊勢崎で提供するなら、客層やコンセプトに合わせて『家庭的な安心感』か『異文化体験』かを軸に選ぶとよいと思います。",

  {no:7,cat:"食文化",level:"標準",

   point:"主食・味・背景を比較する。",
   caution:"地域内の多様性にも触れる。"},
  {no:8,cat:"多文化",level:"標準",
   q:"インドでベジタリアンが多い背景と、飲食店運営上の配慮を説明してください。",
   probe:"日本人客とベジタリアン客を両立させるメニュー設計は。",
   skeleton:"背景→ニーズ→運営",
   model:"インドでベジタリアンが多い背景には、宗教上の不殺生思想や、牛や特定の動物を食べない文化的な価値観があります。ベジタリアンといっても、卵を避ける人、乳製品は取る人など、細かな違いがあるため、原材料表示を丁寧に行い、調理器具や油を分けるなどの配慮が必要です。日本人客とベジタリアン客を両立させるには、肉料理とベジタリアン料理を両方用意し、選べるメニュー構成にすること、スタッフが基本的な文化背景を理解して説明できることが重要です。",
   point:"文化理解を具体的な店舗運営へ落とす。",
   caution:"全員が同じ食習慣だと決めつけない。"},
  {no:9,cat:"多文化",level:"基礎",
   q:"伊勢崎市に外国人住民が多いことのメリットを挙げてください。",

   point:"経済・人口・文化をバランスよく述べる。"},
   caution:"メリットだけで課題を無視しない。",
  {no:10,cat:"多文化",level:"標準",
   q:"多文化共生を進める際の課題を挙げ、解決策を一つ提案してください。",
   probe:"その施策の費用や担い手はどうしますか。",
   skeleton:"課題→原因→解決策",

   point:"課題と解決策が対応している。",
   caution:"外国人だけに適応を求めない。"},
  {no:11,cat:"多文化",level:"応用",
   q:"多文化共生と治安への不安感を、偏見を生まないように論じてください。",

   skeleton:"事実と感情を分離→対話",

   point:"偏見を避け、データと対話を両立する。",
   caution:"根拠なく安全・危険と断定しない。"},
  {no:12,cat:"企画",level:"基礎",
   q:"レトロモダンとグローカルを、それぞれ説明してください。",
   probe:"両方を伊勢崎のまちづくりにどう取り入れますか。",
   skeleton:"二語を定義→統合案",
   model:"レトロモダンは、懐かしいデザインや文化を現代の機能やライフスタイルに合わせて再編集する考え方です。グローカルは、世界的な視野を持ちながら、具体的な行動は地域に根ざして行うという姿勢を指します。伊勢崎では、銘仙柄や古い建物を活かしたレトロモダンな空間づくりを行い、その魅力をSNSや海外向けサイトで発信することで、グローカルなまちづくりにつなげることができます。",
   point:"二概念を具体策で結び付ける。",
   caution:"雰囲気だけの説明にしない。"},
  {no:13,cat:"経営",level:"標準",
   q:"ブランディングとマーケティングの違いを説明してください。",
   probe:"新店舗の認知を広げる具体策は何ですか。",

   point:"違いと関係を説明する。",
   caution:"広告だけをマーケティングとしない。"},
  {no:14,cat:"学問",level:"標準",
   q:"経営学・社会学・データサイエンスを地域活性化にどう組み合わせますか。",
   probe:"三つのうち大学で最も深く学びたい分野は。",
   skeleton:"各学問の役割→統合",
   model:"経営学では、持続可能な事業モデルや資金計画、組織運営の方法を学びます。社会学では、住民同士の関係性や地域コミュニティの構造、文化的背景を理解します。データサイエンスでは、人口や売上、来訪者数などのデータを分析し、現状把握や施策の効果検証を行います。これら三つを往復しながら、数字だけでなく人の気持ちも踏まえた、実行可能で受け入れられる地域活性化策を設計することが重要だと考えます。",
   point:"学際性を具体的な役割で示す。",
   caution:"学問名の羅列にしない。",
  {no:15,cat:"学問",level:"応用",
   q:"行動心理学を使って、中心市街地への来訪や回遊を促す仕掛けを提案してください。",

   skeleton:"行動目標→仕掛け→倫理",
   model:"行動心理学では、人が行動を起こすきっかけや、選択を左右する要因を学びます。中心市街地では、回遊マップやスタンプラリー、混雑状況の見える化などを使って『もう一軒寄ってみよう』と思える仕掛けをつくることができます。また、人気店や口コミを活用した社会的証明も有効です。ただし、過度な誘導や不安をあおる表現、個人情報の過剰な収集には注意し、選択の自由とプライバシーを尊重することが倫理的に重要です。",
   point:"行動変容の仕組みと倫理を説明する。",
   caution:"心理操作を肯定しない。"},
  {no:16,cat:"地域資源",level:"基礎",
   q:"地域資源とは何ですか。伊勢崎の地域資源を三つ挙げてください。",

   skeleton:"定義→例→選択",

   point:"有形・無形資源を挙げる。",
   caution:"観光名所だけに限定しない。"},
  {no:17,cat:"事例研究",level:"標準",

  {no:19,cat:"地域社会",level:"標準",
   q:"シビックプライドは、なぜまちづくりに重要なのですか。",

   model:"シビックプライドは、地域への誇りや愛着、当事者意識を指します。これがあると、住民がまちづくりやイベントに主体的に参加し、継続的な活動を支える力になります。行政は、参加の機会や場を設計することはできますが、誇りそのものは住民同士の共同体験や成功体験から育つものです。そのため、行政は『一緒にやる場』をつくり、住民が自分たちのまちを好きになれるきっかけを増やす役割を担うことが重要です。",

// 質問画面
function renderQuestion(){
  const d = QA[idx];
  app.innerHTML = `
    <div class="card">
      <h2>Q${d.no}. ${d.q}</h2>
      <p><b>分野：</b>${d.cat} ／ <b>難度：</b>${d.level}</p>
      <p><b>深掘り質問：</b>${d.probe}</p>
      <p><small>まずは「結論→理由→具体例」で声に出して答えてみてください。</small></p>

      <button class="btn secondary" onclick="showHint()">ヒントを見る</button>
      <button class="btn primary" onclick="showAnswer()">模範解答を見る</button>
      <button class="btn secondary" onclick="next()">次の問題へ進む</button>

      <button class="btn secondary" onclick="readText()">読み上げる</button>
      <button class="btn secondary" onclick="stopReading()">読み上げ停止</button>

      <button class="btn secondary" onclick="randomStart()">ランダム出題</button>
      <button class="btn secondary" onclick="reviewWeak()">弱点だけ復習する</button>
      <button class="btn secondary" onclick="showCategoryMenu()">分野別で出題する</button>
    </div>
  `;
}

// ヒント
function showHint(){
  const d = QA[idx];
  const hint = `
    <p><b>回答の骨格：</b>${d.skeleton}</p>
    <p><b>評価ポイント：</b>${d.point}</p>
    <p><b>注意点：</b>${d.caution}</p>
  `;
  const card = app.querySelector(".card");
  const oldHint = card.querySelector(".hint");
  if(oldHint) oldHint.remove();
  const div = document.createElement("div");
  div.className = "hint";
  div.innerHTML = hint;
  card.appendChild(div);
}

// 模範解答
function showAnswer(){
  const d = QA[idx];

  loadWeak();
  if(!weak.includes(idx)){
    weak.push(idx);
    localStorage.setItem("weak_list", JSON.stringify(weak));
  }

  app.innerHTML = `
    <div class="card">
      <h2>Q${d.no}. ${d.q}</h2>
      <p><b>分野：</b>${d.cat} ／ <b>難度：</b>${d.level}</p>
      <p><b>深掘り質問：</b>${d.probe}</p>
      <hr>
      <p><b>回答の骨格：</b>${d.skeleton}</p>
      <p><b>詳しい模範解答：</b>${d.model}</p>
      <p><b>評価ポイント：</b>${d.point}</p>
      <p><b>注意点：</b>${d.caution}</p>

      <button class="btn primary" onclick="next()">次の問題へ</button>
      <button class="btn secondary" onclick="renderQuestion()">もう一度考える</button>

      <button class="btn secondary" onclick="readModel()">模範解答を読み上げる</button>
      <button class="btn secondary" onclick="stopReading()">読み上げ停止</button>
    </div>
  `;
}

// 次へ
function next(){
  idx++;
  saveProgress();

  if(idx >= QA.length){
    app.innerHTML = `
      <div class="card">
        <h2>全38問終了</h2>
        <p>お疲れさまでした。</p>
      </div>
    `;
  }else{
    renderQuestion();
  }
}

// ランダム出題
function randomStart(){
  idx = Math.floor(Math.random() * QA.length);
  renderQuestion();
}

// 弱点復習
function reviewWeak(){
  loadWeak();
  if(weak.length === 0){
    app.innerHTML = `
      <div class="card">
        <h2>弱点はまだありません</h2>
        <p>模範解答を見た問題が弱点として登録されます。</p>
      </div>
    `;
    return;
  }
  idx = weak[Math.floor(Math.random() * weak.length)];
  renderQuestion();
}

// 分野別メニュー
function showCategoryMenu(){
  const cats = [...new Set(QA.map(q => q.cat))];
  app.innerHTML = `
    <div class="card">
      <h2>分野別出題</h2>
      ${cats.map(c => `<button class="btn secondary" onclick="startCategory('${c}')">${c}</button>`).join("")}
      <button class="btn secondary" onclick="renderQuestion()">戻る</button>
    </div>
  `;
}

// 分野別出題
function startCategory(cat){
  const list = QA.filter(q => q.cat === cat);
  const d = list[Math.floor(Math.random() * list.length)];
  idx = QA.indexOf(d);
  renderQuestion();
}

// 初期表示
loadProgress();
renderQuestion();

// =========================
// PWA Service Worker 登録
// =========================
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
